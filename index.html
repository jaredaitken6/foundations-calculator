<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Foundations Calculator</title>
</head>
<body>
    <input type="text" id="calculator-display" placeholder="Enter Number">
    <button type="button" class="calculator-button" id="one">1</button>
    <button type="button" class="calculator-button" id="two">2</button>
    <button type="button" class="calculator-button" id="three">3</button>
    <button type="button" class="calculator-button" id="four">4</button>
    <button type="button" class="calculator-button" id="five">5</button>
    <button type="button" class="calculator-button" id="six">6</button>
    <button type="button" class="calculator-button" id="seven">7</button>
    <button type="button" class="calculator-button" id="eight">8</button>
    <button type="button" class="calculator-button" id="nine">9</button>
    <button type="button" class="calculator-button" id="zero">0</button>
    <button type="button" class="calculator-button" id="plus">+</button>
    <button type="button" class="calculator-button" id="minus">-</button>
    <button type="button" class="calculator-button" id="multiply">x</button>
    <button type="button" class="calculator-button" id="divide">÷</button>
    <button type="button" class="calculator-button" id="equals">=</button>
    <button type="button" class="calculator-button" id="clear">clear</button>

</body>
</html>
